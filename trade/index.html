<script>
  // In the installed Android app, Android shows its own opening screen (the logo, placed by Android on every phone).
  // This page then draws no logo of its own there, so Chrome keeps Android's screen up and hands straight to the app.
  // Same as the staff app pages (foods/, bakehouse/). Browsers, iPhones and iPads show the 240 logo, fading in.
  try {
    if (/Android/i.test(navigator.userAgent) && matchMedia('(display-mode: standalone)').matches)
      document.documentElement.className = 'android-app';
  } catch (e) {}
</script>
<title>Ottolive · Trade Orders</title>
<style>
  /* The whole screen is the icon's charcoal while Google starts the app; the app fades in over it once loaded. */
  html, body { margin: 0; height: 100%; background: #393a34; overflow: hidden; }
  #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #393a34; }
  #splash img { width: 240px; height: 240px; display: block; animation: logo-in .4s ease-out both; }
  @keyframes logo-in { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
  /* Installed Android: no logo of our own, so Android keeps its own opening screen until the app is ready. */
  .android-app #splash img { display: none; }
  iframe { position: fixed; top: 0; left: 0; border: 0; display: block; width: 100%; height: 100%; height: 100dvh;
           opacity: 0; transition: opacity .25s ease; }
  body.ready iframe { opacity: 1; }
  noscript a { color: #f4efe6; font-family: Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icon-512.png" alt=""></div>
<!-- The live trade app (Apps Script "Ottolive Order Intake"). Shown inside this page so Google's
     "created by a Google Apps Script user" banner does not appear. The app already allows framing (ALLOWALL). -->
<iframe id="app" title="Ottolive trade orders"
  src="https://script.google.com/macros/s/AKfycby-PEntQ7hcmsR2A5Nm_F_Eas3aC-ooCnOKXqfRBmsADXTbH2jVwRfZpMseF30-sT9B/exec"
  allow="clipboard-write"></iframe>
<script>
  // Show the app as soon as Google has loaded it (or after 12 s, so a slow load never hides it), and switch the phone's
  // top bar to the trade app's own header colour: paper in light mode, dark in dark mode.
  (function () {
    var shown = false;
    function show() {
      if (shown) return; shown = true; document.body.className = 'ready';
      try { document.getElementById('theme').setAttribute('content', matchMedia('(prefers-color-scheme: dark)').matches ? '#23241f' : '#fbf9f6'); } catch (e) {}
    }
    document.getElementById('app').addEventListener('load', show);
    setTimeout(show, 12000);
  })();
</script>
<noscript><style>iframe { opacity: 1; }</style><p style="position:fixed;bottom:0;left:0;right:0;margin:0;padding:20px;background:#393a34"><a href="https://script.google.com/macros/s/AKfycby-PEntQ7hcmsR2A5Nm_F_Eas3aC-ooCnOKXqfRBmsADXTbH2jVwRfZpMseF30-sT9B/exec">Open trade orders</a></p></noscript>
