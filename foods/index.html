<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Foods">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#393a34">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="preconnect" href="https://script.google.com">
<title>Ottolive Foods app</title>
<style>
  /* The whole screen is the logo's own colour while Google starts the app, so the icon, the opening screen and the
     wait all look like one piece. The app fades in over it as soon as Google has loaded it. */
  html, body { margin: 0; height: 100%; background: #393a34; overflow: hidden; }
  #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #393a34; }
  #splash img { width: 160px; height: 160px; display: block; }
  /* Starts below the phone's status bar (clock, battery), so the top of the app is never hidden under it. */
  iframe { position: fixed; top: env(safe-area-inset-top, 0px); right: 0; bottom: 0; left: 0; border: 0; display: block;
           width: 100%; height: calc(100vh - env(safe-area-inset-top, 0px)); height: calc(100dvh - env(safe-area-inset-top, 0px));
           opacity: 0; transition: opacity .25s ease; }
  body.ready iframe { opacity: 1; }
  noscript a { color: #393a34; font-family: Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<!-- The live Ottolive Foods app (Google Apps Script), shown inside this page so that the iPad / phone home-screen icon is the
     Ottolive logo and Google's banner does not appear. The app already allows framing (ALLOWALL). Nothing is stored here. -->
<div id="splash" aria-hidden="true"><img src="icon-512.png" alt=""></div>
<iframe id="app" title="Ottolive Foods app" src="https://script.google.com/macros/s/AKfycbxI70vt58yNEG9fnoV_ZDaBCa2Jq0_4edwIyv_A9-lAntrZYa4Q8SzgzUm3yExy9oAO/exec" allow="camera; clipboard-write"></iframe>
<script>
  // Show the app once Google has loaded it; never leave anyone on the logo for more than 12 seconds.
  (function () {
    var shown = false;
    function show() { if (shown) return; shown = true; document.body.className = 'ready'; }
    document.getElementById('app').addEventListener('load', show);
    setTimeout(show, 12000);
  })();
</script>
<noscript><style>iframe { opacity: 1; }</style><p style="position:fixed;bottom:0;left:0;right:0;margin:0;padding:20px;background:#fbf9f6"><a href="https://script.google.com/macros/s/AKfycbxI70vt58yNEG9fnoV_ZDaBCa2Jq0_4edwIyv_A9-lAntrZYa4Q8SzgzUm3yExy9oAO/exec">Open the Ottolive Foods app</a></p></noscript>
</body>
</html>
