<script>
  // In the installed Android app, Android shows its own opening screen (the logo, placed by Android on every phone).
  // This page then draws no logo of its own there, so nothing on the page counts as content and Chrome keeps
  // Android's screen up until the page has loaded (which waits for the app in the frame), then shows the app.
  // Chosen by Dom 15 Nov 2026 after testing on his S25: the same on every Android phone, no per-phone numbers.
  // (Matching our own logo to Android's needed each phone's status bar height; see git history before this change.)
  // iPads, iPhones and browsers keep the 240 logo, fading in over the logo-colour start-up screen.
  try {
    if (/Android/i.test(navigator.userAgent) && matchMedia('(display-mode: standalone)').matches)
      document.documentElement.className = 'android-app';
  } catch (e) {}
</script>
<title>Ottolive Bakehouse app</title>
<style>
  /* The whole screen is the logo's own colour while Google starts the app, so the icon, the opening screen and the
     wait all look like one piece. The app fades in over it as soon as Google has loaded it. */
  html, body { margin: 0; height: 100%; background: #c9b6a3; overflow: hidden; }
  #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #c9b6a3; }
  #splash img { width: 240px; height: 240px; display: block; animation: logo-in .4s ease-out both; }
  @keyframes logo-in { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
  /* Installed Android: no logo of our own, so Android keeps its own opening screen until the app is ready. */
  .android-app #splash img { display: none; }
  /* Starts below the phone's status bar (clock, battery), so the top of the app is never hidden under it. */
  iframe { position: fixed; top: env(safe-area-inset-top, 0px); right: 0; bottom: 0; left: 0; border: 0; display: block;
           width: 100%; height: calc(100vh - env(safe-area-inset-top, 0px)); height: calc(100dvh - env(safe-area-inset-top, 0px));
           opacity: 0; transition: opacity .25s ease; }
  body.ready iframe { opacity: 1; }
  noscript a { color: #393a34; font-family: Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<!-- The live Ottolive Bakehouse app (Google Apps Script), shown inside this page so that the iPad / phone home-screen icon is the
     Ottolive logo and Google's banner does not appear. The app already allows framing (ALLOWALL). Nothing is stored here. -->
<div id="splash" aria-hidden="true"><img src="icon-512.png" alt=""></div>
<iframe id="app" title="Ottolive Bakehouse app" src="https://script.google.com/macros/s/AKfycbw_0H1Wq9k0hkGx2rCQexyinXvl2vGHfhSDW9lPj4MzdyKOGAyTqKGiD_qO-WD9zIfqRg/exec" allow="camera; clipboard-write"></iframe>
<script>
  // Show the app once Google has loaded it; never leave anyone on the logo for more than 12 seconds.
  (function () {
    var shown = false;
    function show() { if (shown) return; shown = true; document.body.className = 'ready'; }
    document.getElementById('app').addEventListener('load', show);
    setTimeout(show, 12000);
  })();
</script>
<noscript><style>iframe { opacity: 1; }</style><p style="position:fixed;bottom:0;left:0;right:0;margin:0;padding:20px;background:#fbf9f6"><a href="https://script.google.com/macros/s/AKfycbw_0H1Wq9k0hkGx2rCQexyinXvl2vGHfhSDW9lPj4MzdyKOGAyTqKGiD_qO-WD9zIfqRg/exec">Open the Ottolive Bakehouse app</a></p></noscript>
</body>
